[project]
name = "datalens-backend"
version = "0.1.0"
description = "DataLens Backend Foundation and API Architecture"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30.0",
    "alembic>=1.14.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.6.0",
    "argon2-cffi>=23.1.0",
    "python-multipart>=0.0.18",
    "pyjwt>=2.9.0",
    "email-validator>=2.2.0",
    "pyarrow>=26.0.0",
    "openpyxl>=3.1.5",
    "duckdb>=2.0.0",
    "numpy>=1.26.0",
    "scikit-learn>=1.5.0",
    "reportlab>=5.1.0",
    "python-docx>=1.2.0",
    "google-genai>=1.0.0",
    "cryptography>=43.0.0",
    "pymysql>=1.1.0",
    "pymongo>=4.9.0",
    "boto3>=1.35.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.28.0",
    "ruff>=0.8.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501", "B904", "UP046", "BLE001", "PLW1510", "SIM102", "B008"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["."]

